<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Todo App — Assadullah</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem}
  .app{width:100%;max-width:520px}
  h1{font-size:1.8rem;margin-bottom:.25rem}
  p.sub{color:#94a3b8;margin-bottom:1.5rem}
  form{display:flex;gap:.5rem;margin-bottom:1rem}
  input[type=text]{flex:1;padding:.8rem 1rem;border-radius:.6rem;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:1rem}
  button{padding:.8rem 1.1rem;border:0;border-radius:.6rem;background:#6366f1;color:#fff;font-weight:600;cursor:pointer}
  button:hover{background:#4f46e5}
  .filters{display:flex;gap:.5rem;margin-bottom:1rem}
  .filters button{background:#1e293b;color:#cbd5e1}
  .filters button.active{background:#6366f1;color:#fff}
  ul{list-style:none}
  li{display:flex;align-items:center;gap:.75rem;background:#1e293b;padding:.8rem 1rem;border-radius:.6rem;margin-bottom:.5rem}
  li.done span{text-decoration:line-through;color:#64748b}
  li span{flex:1}
  li button{background:transparent;color:#f87171;padding:.3rem .6rem}
  li input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:#6366f1}
  .count{color:#94a3b8;margin-top:1rem;font-size:.9rem}
  a.back{color:#818cf8;display:inline-block;margin-top:1.5rem}
</style>
</head>
<body>
<div class="app">
  <h1>Simple Todo App</h1>
  <p class="sub">Add tasks, tick them off, and they stay saved in your browser.</p>
  <form id="form"><input id="input" type="text" placeholder="Add a new task..." required><button type="submit">Add</button></form>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
  </div>
  <ul id="list"></ul>
  <p class="count" id="count"></p>
  <a class="back" href="https://assadqureshi0925.github.io/assadullah-portfolio/">← Back to portfolio</a>
</div>
<script>
  const KEY="assadullah-todos";
  let todos=JSON.parse(localStorage.getItem(KEY)||"[]");
  let filter="all";
  const list=document.getElementById("list"), count=document.getElementById("count");
  function save(){localStorage.setItem(KEY,JSON.stringify(todos));}
  function render(){
    const shown=todos.filter(t=>filter==="all"?true:filter==="done"?t.done:!t.done);
    list.innerHTML="";
    shown.forEach(t=>{
      const li=document.createElement("li");
      if(t.done) li.className="done";
      const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done;
      cb.onchange=()=>{t.done=cb.checked; save(); render();};
      const span=document.createElement("span"); span.textContent=t.text;
      const del=document.createElement("button"); del.textContent="Delete";
      del.onclick=()=>{todos=todos.filter(x=>x!==t); save(); render();};
      li.append(cb,span,del); list.appendChild(li);
    });
    const left=todos.filter(t=>!t.done).length;
    count.textContent=left+" task"+(left===1?"":"s")+" left";
  }
  document.getElementById("form").addEventListener("submit",e=>{
    e.preventDefault();
    const input=document.getElementById("input");
    todos.push({text:input.value.trim(),done:false}); input.value=""; save(); render();
  });
  document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); filter=b.dataset.filter; render();
  });
  render();
</script>
</body>
</html>
